name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firefox extension validator
        run: npm install --global web-ext

      - name: Install Python dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Run tests
        working-directory: backend
        run: uv run python -m unittest discover -s tests -v

      - name: Build browser-extension packages
        shell: pwsh
        run: ./scripts/build-extension.ps1 -Target Firefox -Clean

      - name: Lint Firefox package
        run: web-ext lint --source-dir .build/extension-package-firefox --warnings-as-errors

      - name: Verify generated release packages
        working-directory: backend
        run: uv run python -m unittest discover -s tests -v
